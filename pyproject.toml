[project]
name = "carql"
version = "2.0.0"
description = "Deep-Q car racing: batched numpy physics, PyTorch DQN/PPO agents, anti-aliased pyglet 2 viewer, track builder"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "pyglet>=2.1",
    "pillow>=10",
    "scikit-image>=0.22",
    "scipy>=1.11",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
carql = "carql.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["carql", "carql.agents", "carql.viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
